[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "af2rank-pipeline"
version = "0.1.0"
description = "AF2Rank-based protein complex rescoring and interface assessment pipeline"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DockQ/src/DockQ/LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.9,<3.12"
dependencies = [
  "numpy>=1.23,<1.24",
  "biopython>=1.79,<1.80",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
dockq = ["networkx>=3.2,<4"]
many-chains = ["scipy>=1.11,<1.12"]
inference = [
  "colabdesign @ git+https://github.com/sokrypton/ColabDesign.git@094e2cb3603dee7d99846e0977736bd943c830c2",
  "jax==0.4.20",
  "jaxlib==0.4.20",
  "dm-haiku==0.0.11",
  "scipy>=1.11,<1.12",
]

[project.scripts]
af2rank-pipeline = "af2rank_pipeline.cli:main"

[tool.setuptools]
packages = ["af2rank_pipeline", "DockQ"]

[tool.setuptools.package-dir]
DockQ = "DockQ/src/DockQ"

[tool.setuptools.package-data]
DockQ = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
